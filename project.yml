name: BadPhotosOut
options:
  bundleIdPrefix: com.veli.badphotosout
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: NO
targets:
  BadPhotosOut:
    type: application
    platform: macOS
    sources:
      - path: BadPhotosOut
        excludes:
          - Info.plist
          - BadPhotosOut.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.veli.badphotosout
        PRODUCT_NAME: BadPhotosOut
        INFOPLIST_FILE: BadPhotosOut/Info.plist
        CODE_SIGN_ENTITLEMENTS: BadPhotosOut/BadPhotosOut.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
